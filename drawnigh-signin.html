<title>DrawNigh — signing you in</title>
<!-- DrawNigh 1.1.9, Decision 349. Google returns the Firefox add-on's sign-in
     here. The add-on itself reads this page's address and closes the tab.
     This page has no script, fetches nothing and keeps nothing. -->
<style>
  :root { --bg: #15110e; --ink: #e9dfc8; --dim: #b3a689; --gold: #e3c477; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  h1 { color: var(--gold); font-weight: normal; font-size: 1.6rem; margin: 0 0 12px; }
  p { color: var(--dim); line-height: 1.5; margin: 0 0 10px; }
</style>
</head>
<body>
<main>
  <h1>DrawNigh</h1>
  <p>Signing you in to sync…</p>
  <p>This tab closes by itself. If it stays open, close it and go back to DrawNigh.</p>
</main>
</body>
